name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      - run: npm run coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.node-version }}
          path: coverage/lcov.info

  benchmark:
    runs-on: ubuntu-latest
    # Run on Node 20 only — benchmark consistency matters more than matrix coverage
    permissions:
      contents: write      # needed to push results to gh-pages
      pull-requests: write # needed to post comparison comments on PRs

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - run: npm install

      - name: Run benchmarks
        run: npm run bench:ci

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: bench-ci.json
          retention-days: 90

      - name: Store results / compare against baseline
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: customBiggerIsBetter
          output-file-path: bench-ci.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Only advance the stored baseline on pushes to main, not on PRs
          auto-push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          # Alert (and comment on PR) when any metric is more than ~23% slower than baseline
          # (alert-threshold: '130%' means baseline/current > 1.3 triggers alert)
          alert-threshold: '130%'
          fail-on-alert: false
          comment-on-alert: true
          alert-comment-cc-users: '@whoughton'
          benchmark-data-dir-path: dev/bench
